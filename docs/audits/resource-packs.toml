# Audit of the packs in resourcepacks/: what each one actually contributes.

[audit]
name = "resource-packs"
date = 2026-11-26
method = """
File paths only: no images opened, nothing checked in game.
Compared each pack's asset paths with the asset namespaces of the jars in mods/ and with the load order in
config/packfinder/resourcepack_order.json. lang, sounds.json, atlas and font files are not counted.
"""
usable_means = """
Not for a missing mod, not in a format nothing installed reads, not overridden by a higher pack.
Usable counts are approximate upper bounds: an installed mod may not contain every item a pack targets.
"""

# verdict: "drop" = safe to remove, "fix-or-drop" = a main part is inert or overridden,
# "optional" = small feature, a matter of taste, "keep".

[[pack]]
file = "Universal Bushy Leaves.zip"
verdict = "drop"
asset_files = 108
usable = 4
notes = "chipped, ars_nouveau, vinery etc. not installed; only 3 vanilla and 1 Quark file apply. Sits on top of Better Leaves."

[[pack]]
file = "§e[FORGE]Eating Animations More Compat.zip"
verdict = "drop"
asset_files = 2924
usable = 50
notes = "2814 files are for missing mods; 60 more sit in an odd textures/item/models/item path. Usable files are mostly Farmer's Delight and Quark. Keep only if the animations show in game."

[[pack]]
file = "Clear Glass Pack 1.20.zip"
verdict = "fix-or-drop"
asset_files = 960
usable = 36
notes = "924 files are OptiFine connected textures and no Continuity or similar mod was found. Add one that works on Forge, or keep only for the 36 plain textures."

[[pack]]
file = "DarkAtmosphere2.0.zip"
verdict = "fix-or-drop"
asset_files = 17
usable = 5
notes = "Sky, lightmap and water changes need Polytone, which is not installed. 2 Wythers textures unused. Only 5 vanilla textures work."

[[pack]]
file = "TaxCreepyMob+M.1.20.1+ResP.1.0.0.zip"
verdict = "fix-or-drop"
asset_files = 19
overridden = 10
overridden_by = "FA+Emissive-v1.6.zip"
notes = "Pick which look is wanted: move it above FA+Emissive or remove it."

[[pack]]
file = "§6Immersive§8_§6Interfaces§8.zip"
verdict = "keep"
asset_files = 318
usable = 286
notes = "The 32 optifine/gui files need OptiGUI, which was not found. The rest work."

[[pack]]
file = "Better-Leaves-9.5.zip"
